postgres:
  image: postgres:18.3-alpine3.23
  empty: false     # don't try to restore old database -> create one from scratch
  #backupFullKeep: 10
  #terminationGracePeriodSeconds: 60

rclone:
  image: rclone/rclone:sha-6805da6
  # rem: include final ":" (rem:) or "/" (rem:folder/)
  rem: "rem:postgres/"
  # like secretKeyRef: 'name' of the secret and 'key' of that secret
  conf:
    # the name of the secret in the same namespace
    name: rclone-conf
    # the key within the secret secret
    key: configData

podLabels:
  app: db-server
